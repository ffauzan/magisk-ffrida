name: Frida Stealth

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida tag (default: latest release)"
        required: false
      force:
        description: "Force a new revision"
        type: boolean
        default: false
  push:
    paths:
      - "patches/**"
      - "scripts/**"
      - "base/**"
      - "build.py"
      - "versions.json"
      - ".github/workflows/main.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: frida-stealth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.frida_version }}"
          if [ -z "$V" ]; then
            V="$(curl -fsSL https://api.github.com/repos/frida/frida/releases/latest | jq -r .tag_name)"
          fi
          case "$V" in
            *[!0-9A-Za-z._-]*|"") echo "invalid version: $V"; exit 1;;
          esac
          N=1
          while git rev-parse -q --verify "refs/tags/$V-$N" >/dev/null; do N=$((N+1)); done
          TAG="$V-$N"
          RELEASE=true
          if git rev-parse -q --verify "refs/tags/$V-$((N-1))" >/dev/null \
             && [ "${{ inputs.force }}" != "true" ] \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            RELEASE=false
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "frida=$V tag=$TAG release=$RELEASE"

  patch-check:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone frida source
        run: git clone --depth 1 --branch "${{ needs.check.outputs.version }}" --recurse-submodules --shallow-submodules https://github.com/frida/frida /tmp/frida-src
      - name: Apply patch set
        run: ./scripts/apply-patches.sh /tmp/frida-src

  build:
    needs: [check, patch-check]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build bison flex ruby pkg-config libssl-dev
      - name: Install Android NDK r29
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r29" >> "$GITHUB_ENV"
      - name: Build patched frida-server
        env:
          STEALTH_RENAMER: ${{ github.workspace }}/scripts/anti-anti-frida.py
        run: ./scripts/build-frida.sh "${{ matrix.arch }}" "${{ needs.check.outputs.version }}" /tmp/frida-src
      - uses: actions/upload-artifact@v4
        with:
          name: frida-server-${{ matrix.arch }}
          path: downloads/frida-server-${{ needs.check.outputs.version }}-android-${{ matrix.arch }}
          if-no-files-found: error

  package:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          pattern: frida-server-*
          path: downloads
          merge-multiple: true
      - name: Compress binaries
        run: |
          cd downloads
          for f in frida-server-*; do xz -T0 -k "$f"; rm "$f"; done
      - name: Package module
        run: python3 build.py --frida-tag "${{ needs.check.outputs.version }}" --project-tag "${{ needs.check.outputs.tag }}"
      - name: Checksums
        run: sha256sum downloads/*.xz build/MagiskFrida-*.zip build/updater.json > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: |
            build/MagiskFrida-*.zip
            build/updater.json
            build/SHA256SUMS
            downloads/*.xz
          if-no-files-found: error

  release:
    needs: [check, package]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: module
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          make_latest: true
          files: |
            out/build/MagiskFrida-*.zip
            out/build/updater.json
            out/build/SHA256SUMS
            out/downloads/*.xz

  notify:
    needs: [check, patch-check, build, package, release]
    if: always() && needs.check.outputs.release == 'true' && (needs.patch-check.result == 'failure' || needs.build.result == 'failure' || needs.package.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Frida ${{ needs.check.outputs.version }} build failed" \
            --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
